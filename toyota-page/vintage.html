<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota 90's Experience</title>
    <link rel="stylesheet" href="../toyota-page/css/vintage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="crt-effect">
    <div class="vhs-overlay"></div>
    <div class="scanlines"></div>
    
    <header class="vhs-header">
        <h1 class="glitch" data-text="TOYOTA">TOYOTA</h1>
        <h2>VINTAGE EXPERIENCE <span class="blink">_</span></h2>
    </header>
    
    <main class="vhs-main">
        <div class="vhs-player-container">
            <div class="vhs-player">
                <div class="vhs-screen">
                    <video class="vhs-video" loop>
                        <source src="../toyota-page/assets/videos/toyota-ad-jp.mp4" type="video/mp4">
                        Ваш браузер не поддерживает видео
                    </video>
                    <div class="vhs-static"></div>
                </div>
                
                <div class="vhs-controls">
                    <button class="vhs-button rewind" title="Rewind"><i class="fas fa-backward"></i></button>
                    <button class="vhs-button play" title="Play/Pause"><i class="fas fa-play"></i></button>
                    <button class="vhs-button stop" title="Stop"><i class="fas fa-stop"></i></button>
                    <button class="vhs-button ffwd" title="Fast Forward"><i class="fas fa-forward"></i></button>
                    <div class="vhs-track">
                        <div class="vhs-progress"></div>
                    </div>
                    <button class="vhs-button eject" title="Eject"><i class="fas fa-eject"></i></button>
                </div>
                
                <div class="vhs-cassette">
                    <img src="../toyota-page/assets/icons/vhs-cassette.png" alt="VHS Cassette" loading="lazy">
                    <div class="cassette-label">TOYOTA 1994</div>
                    <div class="reels"></div>
                </div>
            </div>
        </div>
        
        <div class="vhs-gallery">
            <div class="vhs-item glitch-box" data-text="SUPRA MKIV">
                <img src="../toyota-page/assets/icons/vhs-cassette.png" class="vhs-image" loading="lazy" alt="Toyota Supra MKIV">
            </div>
            <div class="vhs-item glitch-box" data-text="CELICA GT4">
                <img src="../toyota-page/assets/icons/celica-st205.jpg" class="vhs-image" loading="lazy" alt="Toyota Celica GT4">
            </div>
            <div class="vhs-item glitch-box" data-text="MR2">
                <img src="../toyota-page/assets/icons/mr2-w20.jpg" class="vhs-image" loading="lazy" alt="Toyota MR2">
            </div>
        </div>
    </main>
    
    <footer class="vhs-footer">
        <div class="vhs-date">©1994 TOYOTA MOTOR CORPORATION</div>
        <div class="vhs-counter">VISITOR NUMBER: <span id="counter">00001</span></div>
    </footer>

    <script src="../toyota-page/vintage.js"></script>
</body>
</html>
