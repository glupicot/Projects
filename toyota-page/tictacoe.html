<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../toyota-page/css/tictacoe.css">
</head>
<body>
     <div class="next-btn-container">
        <a href="../toyota-page/vintage.html" class="next-btn">
            Далее
        </a>
    </div>
    <div class="game-container">
        <h1>Крестики-Нолики<br>против Toyota Sprinter Marino</h1>
        <div class="car-selection">
            <h2>Выберите свою машину:</h2>
            <div class="cars">
                <img src="../toyota-page/assets/icons/toyota-chaser.png" alt="toyota-chaser" data-car="toyota-chaser">
                <img src="../toyota-page/assets/icons/toyota-sprinter-trueno.png" alt="trueno" data-car="trueno">
                <img src="../toyota-page/assets/icons/toyota-soarer.png" alt="Soarer" data-car="soarer">
            </div>
        </div>
        <div class="board-container">
            <div class="board"></div>
            <div class="status"></div>
        </div>
    </div>
    <script src="../toyota-page/tictacoe.js"></script>
</body>
</html>
