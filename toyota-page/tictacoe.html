<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toyota Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../css/tictactoe.css">
</head>
<body>
    <div class="game-container">
        <h1>Крестики-Нолики против Toyota</h1>
        <div class="car-selection">
            <h2>Выберите свою машину:</h2>
            <div class="cars">
                <img src="../assets/icons/toyota-corolla-ceres.png" alt="Corolla Ceres" data-car="ceres">
                <img src="../assets/icons/toyota-sprinter-trueno.png" alt="Sprinter Trueno" data-car="trueno">
                <img src="../assets/icons/toyota-soarer.png" alt="Soarer" data-car="soarer">
            </div>
        </div>
        <div class="board-container">
            <div class="board"></div>
            <div class="status"></div>
        </div>
    </div>
    <script src="../js/tictactoe.js"></script>
</body>
</html>
