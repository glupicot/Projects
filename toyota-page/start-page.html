<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="../toyota-page/css/start-page.css">
    <script src="../toyota-page/start.page.js"></script>
        <title>Тойота-гараж 90-х</title>
</head>
<body>
    
    <div class="search">
        <input type="text" id="searchInput" placeholder="Найти модель (например, Chaser)...">
    </div>

    <div class="garage" id="garage">
    </div>

    <script>
        const cars = [
            { name: "Toyota Corolla Ceres", image: "toyota-corolla-ceres.png" },
            { name: "Toyota Carina ED", image: "toyota-carina-ed.png" },
            { name: "Toyota Chaser", image: "toyota-chaser.png" },
            { name: "Toyota Sprinter Marino", image: "toyota-sprinter-marino.png" },
            { name: "Toyota Sprinter Trueno", image: "toyota-sprinter-trueno.png" },
            { name: "Toyota Crown", image: "toyota-crown.png" },
            { name: "Toyota Soarer", image: "toyota-soarer.png" },
            { name: "Toyota Vista", image: "toyota-vista.png" }
        ];

        const garage = document.getElementById('garage');
        const searchInput = document.getElementById('searchInput');

        function renderCars(filter = '') {
            garage.innerHTML = '';
            const filteredCars = cars.filter(car => 
                car.name.toLowerCase().includes(filter.toLowerCase())
            );
            
            filteredCars.forEach(car => {
                const carElement = document.createElement('div');
                carElement.className = 'car';
                carElement.innerHTML = `
                    <img src="${car.image}" alt="${car.name}">
                    <h3>${car.name}</h3>
                `;
                carElement.addEventListener('click', () => {
                    alert(`Выбрана ${car.name}! Позже здесь будет подробная страница.`);
                });
                garage.appendChild(carElement);
            });
        }

        searchInput.addEventListener('input', (e) => {
            renderCars(e.target.value);
        });

        renderCars();
    </script>
</body>
</html>
